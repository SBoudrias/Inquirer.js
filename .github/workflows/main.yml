name: CI

on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]

# Cancel superseded runs on the same PR. Measured: 3 superseded runs in the
# last 40 wasted 703 runner-seconds of already-doomed CI (run 40248967387
# alone burned 609s after its replacement started). cancel-in-progress does
# not change a single run's wall time; it reclaims queue capacity and (on
# private repos) billed minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

permissions:
  contents: read

jobs:
  # Type-checks and builds all packages, then packs the deno integration
  # project into the artifact the `deno` matrix below consumes. Packing
  # must run after `yarn tsc`: the workspace packages it tarballs publish
  # `dist/` only, so packing without a prior build yields empty tarballs.
  Compile:
    runs-on: ubuntu-latest
    outputs:
      deno-versions: ${{ steps.deno-matrix.outputs.versions }}
    env:
      # The isolated deno workspace has no lockfile, so immutable installs
      # would fail inside it. The repo-level install still passes --immutable.
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'
      # Yarn enables hardened mode on public PRs, re-verifying every package
      # resolution against the registry (+3-7s per job). When yarn.lock and
      # .yarnrc.yml are unchanged from the base commit, the lockfile is already
      # trusted and --immutable still rejects any package.json drift.
      - name: Install dependencies
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git diff --quiet HEAD^1 -- yarn.lock .yarnrc.yml; then
            export YARN_ENABLE_HARDENED_MODE=false
          fi
          yarn install --immutable
      - name: Typescript
        run: yarn tsc
      - name: Pack isolated deno test project
        id: deno-matrix
        env:
          # Freshly isolated workspaces have no lockfile, so hardened lockfile
          # verification adds resolution overhead for nothing.
          YARN_ENABLE_HARDENED_MODE: false
        run: |
          DIR=$(node ./tools/isolate-monorepo-package/src/bin.ts @inquirer/deno-integration-tests)
          cd "$DIR"
          yarn install
          # Deno runs tests directly without Yarn, so exclude .yarn/ from the artifact.
          rm -rf .yarn
          cd -
          tar -czf "${RUNNER_TEMP}/deno-integration-tests.tar.gz" \
            -C "$(dirname "$DIR")" "$(basename "$DIR")"

          # Run the full Deno version matrix on main pushes and Deno/workflow-touching
          # PRs; run latest only on routine PRs to cut 3 redundant cells.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || ! git diff --quiet HEAD^1 -- integration/deno/ .github/workflows/main.yml; then
            echo 'versions=["v2.7.x","v2.8.x","v2.9.x","latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["latest"]' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deno-integration-tests
          path: ${{ runner.temp }}/deno-integration-tests.tar.gz
          if-no-files-found: error
          retention-days: 1

  # This job (like e2e below) runs its own `yarn install`; it does not
  # consume any artifact from Compile, so it can start in parallel with it
  # instead of waiting ~40s for it to finish. The lint steps below don't
  # need built dist/ output, so the full type-check (`yarn tsc`) runs in
  # the Compile job only.
  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'
      # Yarn enables hardened mode on public PRs, re-verifying every package
      # resolution against the registry (+3-7s per job). When yarn.lock and
      # .yarnrc.yml are unchanged from the base commit, the lockfile is already
      # trusted and --immutable still rejects any package.json drift.
      - name: Install dependencies
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git diff --quiet HEAD^1 -- yarn.lock .yarnrc.yml; then
            export YARN_ENABLE_HARDENED_MODE=false
          fi
          yarn install --immutable
      - name: Run linters in parallel
        run: |
          PATH="$PWD/node_modules/.bin:$PATH"
          oxlint . & p1=$!
          oxfmt --check . & p2=$!
          eslint . & p3=$!
          package lint --check & p4=$!
          setup-packages --check & p5=$!
          rc=0
          for p in $p1 $p2 $p3 $p4 $p5; do
            wait "$p" || rc=1
          done
          exit "$rc"

  Unit:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows runs node 26 only: each windows cell cost ~80s (~50s of it
      # fixed setup: checkout, corepack shim overwrite, install) and history
      # shows no failures unique to windows node 20/22/24, so the other three
      # cells duplicated ubuntu's signal at ~240s of runner time per run.
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24, 26]
        include:
          - os: windows-latest
            node-version: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os != 'Windows'
        with:
          persist-credentials: false
          # Two commits deep so that, on pull_request runs, the PR merge ref
          # brings its first parent (the base branch head) along: vitest's
          # --changed below diffs against it.
          fetch-depth: 2
      - run: corepack enable yarn
        if: runner.os != 'Windows'
      # On Windows, actions/checkout runs 6+ `git submodule foreach` spawns (in
      # setup, teardown, and post-cleanup) totaling ~9-13s for a 1s fetch, and
      # overwriting the stale yarn 1.x shims in C:\npm\prefix takes another 3-4s.
      # Overlap the shim overwrite with a direct depth-2 git fetch of GITHUB_SHA
      # (no auth persisted, no post-cleanup step).
      - name: Checkout and enable corepack (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          corepack enable --install-directory 'C:\npm\prefix' yarn &
          corepack_pid=$!
          git init -q
          git -c protocol.version=2 fetch -q --no-tags --depth=2 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --force FETCH_HEAD
          wait "$corepack_pid"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git diff --quiet HEAD^1 -- yarn.lock .yarnrc.yml; then
            export YARN_ENABLE_HARDENED_MODE=false
          fi
          yarn install --immutable
      # Coverage runs on one matrix cell only; every other cell runs bare.
      # The per-OS coverage parity check measured identical coverage on linux
      # and windows, so a single ubuntu cell alone sees everything. On PR runs,
      # non-coverage cells run only suites affected by the PR's changes via
      # `vitest --changed HEAD^1` (thanks to fetch-depth: 2 above; config and
      # package.json changes still trigger the full suite via forceRerunTriggers).
      # Vitest and Jest (--runInBand for its two small CJS adapter suites) run
      # in parallel via direct node invocation to skip Yarn's CLI startup
      # overhead and overlap Jest behind Vitest; their coverage output
      # directories are disjoint.
      - name: Run unit tests (vitest + jest)
        shell: bash
        env:
          COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 26 }}
        run: |
          vitest_args=(--run)
          jest_args=(--runInBand)
          if [ "$COVERAGE" = "true" ]; then
            vitest_args+=(--coverage)
            jest_args+=(--coverage)
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            vitest_args+=(--changed HEAD^1)
          fi

          jest_log=$(mktemp)
          node ./node_modules/jest/bin/jest.js "${jest_args[@]}" >"$jest_log" 2>&1 &
          jest_pid=$!

          vitest_rc=0
          node ./node_modules/vitest/vitest.mjs "${vitest_args[@]}" || vitest_rc=$?

          jest_rc=0
          wait "$jest_pid" || jest_rc=$?
          cat "$jest_log"
          rm -f "$jest_log"

          exit $((vitest_rc || jest_rc))
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 26
        with:
          # Each tool writes its own subdirectory (vitest: coverage/vitest,
          # jest: coverage/jest) and emits istanbul JSON; coverage ownership
          # between them is disjoint (see vitest.config.ts and jest.config.js),
          # so codecov merges the uploads. Each tool cleans only its own
          # subdirectory at start, so run order doesn't matter.
          files: coverage/vitest/coverage-final.json,coverage/jest/coverage-final.json

  # The four e2e suites each run in their own isolated install (spawned by
  # `yarn isolate-monorepo-package`) and don't read each other's output, so
  # they run as four parallel jobs to overlap their fixed setup instead of
  # queuing behind each other. Each builds first: dist/ is packed into the
  # tarballs that the isolated suite below consumes. The full-repo
  # type-check (`yarn tsc` also runs `tsc -p tsconfig.json`) lives in the
  # Compile job only, so the validation is not duplicated here.
  e2e-demo-yarn:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'
      # Yarn enables hardened mode on public PRs, re-verifying every package
      # resolution against the registry (+3-7s per job). When yarn.lock and
      # .yarnrc.yml are unchanged from the base commit, the lockfile is already
      # trusted and --immutable still rejects any package.json drift.
      - name: Install dependencies
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git diff --quiet HEAD^1 -- yarn.lock .yarnrc.yml; then
            export YARN_ENABLE_HARDENED_MODE=false
          fi
          yarn install --immutable
      - run: yarn turbo tsc
      - name: Test isolated build of @inquirer/demo
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: |
          cd $(node ./tools/isolate-monorepo-package/src/bin.ts @inquirer/demo)
          yarn install
          yarn tsc
          cd -

  e2e-demo-npm:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'
      # Yarn enables hardened mode on public PRs, re-verifying every package
      # resolution against the registry (+3-7s per job). When yarn.lock and
      # .yarnrc.yml are unchanged from the base commit, the lockfile is already
      # trusted and --immutable still rejects any package.json drift.
      - name: Install dependencies
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git diff --quiet HEAD^1 -- yarn.lock .yarnrc.yml; then
            export YARN_ENABLE_HARDENED_MODE=false
          fi
          yarn install --immutable
      - run: yarn turbo tsc
      - name: Test isolated build of @inquirer/demo (with npm)
        run: |
          cd $(node ./tools/isolate-monorepo-package/src/bin.ts @inquirer/demo)
          npm install --no-audit --no-fund --prefer-offline
          npm run tsc
          cd -

  e2e-esm-integration:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'
      # Yarn enables hardened mode on public PRs, re-verifying every package
      # resolution against the registry (+3-7s per job). When yarn.lock and
      # .yarnrc.yml are unchanged from the base commit, the lockfile is already
      # trusted and --immutable still rejects any package.json drift.
      - name: Install dependencies
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git diff --quiet HEAD^1 -- yarn.lock .yarnrc.yml; then
            export YARN_ENABLE_HARDENED_MODE=false
          fi
          yarn install --immutable
      - run: yarn turbo tsc
      - name: Run esm integration tests
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: |
          cd $(node ./tools/isolate-monorepo-package/src/bin.ts @inquirer/esm-integration-tests)
          yarn install
          yarn test
          cd -

  e2e-cjs-integration:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'
      # Yarn enables hardened mode on public PRs, re-verifying every package
      # resolution against the registry (+3-7s per job). When yarn.lock and
      # .yarnrc.yml are unchanged from the base commit, the lockfile is already
      # trusted and --immutable still rejects any package.json drift.
      - name: Install dependencies
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git diff --quiet HEAD^1 -- yarn.lock .yarnrc.yml; then
            export YARN_ENABLE_HARDENED_MODE=false
          fi
          yarn install --immutable
      - run: yarn turbo tsc
      - name: Run cjs integration tests
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: |
          cd $(node ./tools/isolate-monorepo-package/src/bin.ts @inquirer/cjs-integration-tests)
          yarn install
          yarn test
          cd -

  # Required check (main ruleset): keeps the 'End to End build tests' name
  # reporting while the suites themselves run in the four e2e jobs above.
  # It needs no runner work of its own: it joins the suite results.
  e2e:
    name: End to End build tests
    runs-on: ubuntu-latest
    needs: [e2e-demo-yarn, e2e-demo-npm, e2e-esm-integration, e2e-cjs-integration]
    steps:
      - name: All e2e suites passed
        run: echo "The e2e suites passed; this job reports their result as the required 'End to End build tests' check."

  deno:
    name: Deno Tests (${{ matrix.deno-version }})
    runs-on: ubuntu-latest
    needs: Compile
    strategy:
      fail-fast: false
      matrix:
        # Deno >= 2.7 is required: earlier versions throw EOPNOTSUPP when
        # node:readline enables raw mode on non-TTY stdin. Routine PRs test
        # `latest` only; pushes to main and Deno-touching PRs test all four.
        deno-version: ${{ fromJson(needs.Compile.outputs.deno-versions) }}
    steps:
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deno-integration-tests
          path: ${{ runner.temp }}
      - name: Run deno integration tests
        run: |
          tar -xzf "${RUNNER_TEMP}/deno-integration-tests.tar.gz" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/deno"
          deno test --allow-env --allow-run=deno integration.test.mjs
