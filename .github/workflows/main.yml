name: CI

on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]

# Cancel superseded runs on the same PR. Measured: 3 superseded runs in the
# last 40 wasted 703 runner-seconds of already-doomed CI (run 40248967387
# alone burned 609s after its replacement started). cancel-in-progress does
# not change a single run's wall time; it reclaims queue capacity and (on
# private repos) billed minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

permissions:
  contents: read

jobs:
  Compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Typescript
        run: yarn tsc

  # This job (like e2e and deno-pack below) runs its own `yarn install` and
  # `yarn tsc`; it does not consume any artifact from Compile, so it can start
  # in parallel with it instead of waiting ~40s for it to finish.
  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn oxlint .
      - run: yarn oxfmt --check .
      - run: yarn eslint .
      - run: yarn package lint --check
      - name: Validate package setup
        run: yarn setup-packages --check

  Unit:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows runs node 26 only: each windows cell cost ~80s (~50s of it
      # fixed setup: checkout, corepack shim overwrite, install) and history
      # shows no failures unique to windows node 22/24, so the other two
      # cells duplicated ubuntu's signal at ~160s of runner time per run.
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        include:
          - os: windows-latest
            node-version: 26
    steps:
      # Windows file IO (git checkout, yarn install, the test suites) pays
      # real-time antivirus scanning and NTFS metadata costs; a Dev Drive
      # (ReFS in dev mode) filters that. Adapted from openai/codex's
      # setup-dev-drive.ps1 (Apache-2.0): instead of routing each build
      # directory through env vars, the workspace itself becomes a junction
      # onto the drive, so the checkout, the in-repo yarn cache
      # (enableGlobalCache: false) and node_modules land on it with no
      # per-step changes. TEMP/TMP move there too (setup-node unpacks the
      # node archive through them). Costs ~2-4s of drive creation per run;
      # before/after timings are measured in the PR that adds this.
      - name: Put the workspace on a Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'dev-drive.vhdx'
          New-VHD -Path $vhd -SizeBytes 64GB -Dynamic | Out-Null
          $mounted = Mount-VHD -Path $vhd -Passthru
          $disk = $mounted | Get-Disk
          $disk | Initialize-Disk -PartitionStyle GPT
          $partition = $disk | New-Partition -AssignDriveLetter -UseMaximumSize
          $volume = $partition | Format-Volume -FileSystem ReFS -NewFileSystemLabel 'InquirerDevDrive' -DevDrive -Confirm:$false -Force
          $drive = "$($volume.DriveLetter):"
          fsutil devdrv query $drive *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "volume at $drive did not register as a Dev Drive"
          }
          # Trust is what switches real-time AV scanning off for the volume;
          # it is policy-dependent, so a failure only warns (matches codex).
          fsutil devdrv trust $drive *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "could not trust the Dev Drive at $drive"
          }
          # The runner pre-creates GITHUB_WORKSPACE as an empty directory;
          # replace it with a junction so every following step writes onto
          # the Dev Drive transparently. Steps run with it as cwd, so move
          # out before removing it.
          New-Item -ItemType Directory -Path "$drive\ws" -Force | Out-Null
          Set-Location $env:RUNNER_TEMP
          Remove-Item -LiteralPath $env:GITHUB_WORKSPACE
          New-Item -ItemType Junction -Path $env:GITHUB_WORKSPACE -Target "$drive\ws" | Out-Null
          New-Item -ItemType Directory -Path "$drive\temp" -Force | Out-Null
          @("TEMP=$drive\temp", "TMP=$drive\temp") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The windows runner image's C:\npm\prefix yarn shims resolve to yarn
      # 1.x, so corepack must overwrite them in place. The old workaround
      # reinstalled corepack with npm (~10s per windows job); overwriting
      # the shims directly costs 3-4s. The image's corepack validates the
      # pinned yarn's signature fine (#2062 no longer reproduces), so
      # integrity checking stays on.
      - run: corepack enable --install-directory "C:\npm\prefix"
        if: runner.os == 'Windows'
      - run: corepack enable
        if: runner.os != 'Windows'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - run: yarn install --immutable
      # Coverage runs on one matrix cell only; every other cell runs the
      # suites bare. The per-OS coverage parity check measured identical
      # coverage on linux and windows (54 files, 1850/1934 vitest and
      # 193/217 jest statements on each OS), so a single ubuntu cell alone
      # sees everything. Bare vitest is 10-16s on windows instead of 28s.
      - run: yarn vitest --run --coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 26
      - run: yarn vitest --run
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node-version == 26) }}
      - run: yarn jest --coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 26
      - run: yarn jest
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node-version == 26) }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 26
        with:
          # Each tool writes its own subdirectory (vitest: coverage/vitest,
          # jest: coverage/jest) and emits istanbul JSON; coverage ownership
          # between them is disjoint (see vitest.config.ts and jest.config.js),
          # so codecov merges the uploads. Each tool cleans only its own
          # subdirectory at start, so run order doesn't matter.
          files: coverage/vitest/coverage-final.json,coverage/jest/coverage-final.json

  e2e:
    name: End to End build tests
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn tsc
      - name: Test isolated build of @inquirer/demo
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/demo)
          yarn set version stable
          yarn install
          yarn tsc
          cd -
      - name: Test isolated build of @inquirer/demo (with npm)
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/demo)
          npm install
          npm run tsc
          cd -
      - name: Run esm integration tests
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/esm-integration-tests)
          yarn set version stable
          yarn install
          yarn test
          cd -
      - name: Run cjs integration tests
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/cjs-integration-tests)
          yarn set version stable
          yarn install
          yarn test
          cd -

  deno-pack:
    name: Deno Pack
    runs-on: ubuntu-latest
    env:
      # The isolated deno workspace has no lockfile, so immutable installs
      # would fail inside it. The repo-level install still passes --immutable.
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn tsc
      - name: Pack isolated deno test project
        run: |
          DIR=$(yarn isolate-monorepo-package @inquirer/deno-integration-tests)
          cd "$DIR"
          yarn set version stable
          yarn install
          cd -
          tar -czf "${RUNNER_TEMP}/deno-integration-tests.tar.gz" \
            -C "$(dirname "$DIR")" "$(basename "$DIR")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deno-integration-tests
          path: ${{ runner.temp }}/deno-integration-tests.tar.gz
          if-no-files-found: error
          retention-days: 1

  deno:
    name: Deno Tests (${{ matrix.deno-version }})
    runs-on: ubuntu-latest
    needs: deno-pack
    strategy:
      fail-fast: false
      matrix:
        # Deno >= 2.7 is required: earlier versions throw EOPNOTSUPP when
        # node:readline enables raw mode on non-TTY stdin.
        deno-version: ['v2.7.x', 'v2.8.x', 'v2.9.x', 'latest']
    steps:
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}
      - run: corepack enable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deno-integration-tests
          path: ${{ runner.temp }}
      - name: Run deno integration tests
        run: |
          tar -xzf "${RUNNER_TEMP}/deno-integration-tests.tar.gz" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/deno"
          yarn test:deno
