name: CI

on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]

# Cancel superseded runs on the same PR. Measured: 3 superseded runs in the
# last 40 wasted 703 runner-seconds of already-doomed CI (run 40248967387
# alone burned 609s after its replacement started). cancel-in-progress does
# not change a single run's wall time; it reclaims queue capacity and (on
# private repos) billed minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

permissions:
  contents: read

jobs:
  # Type-checks and builds all packages, then packs the deno integration
  # project into the artifact the `deno` matrix below consumes. Packing
  # must run after `yarn tsc`: the workspace packages it tarballs publish
  # `dist/` only, so packing without a prior build yields empty tarballs.
  Compile:
    runs-on: ubuntu-latest
    env:
      # The isolated deno workspace has no lockfile, so immutable installs
      # would fail inside it. The repo-level install still passes --immutable.
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Typescript
        run: yarn tsc
      - name: Pack isolated deno test project
        run: |
          DIR=$(yarn isolate-monorepo-package @inquirer/deno-integration-tests)
          cd "$DIR"
          yarn set version stable
          yarn install
          cd -
          tar -czf "${RUNNER_TEMP}/deno-integration-tests.tar.gz" \
            -C "$(dirname "$DIR")" "$(basename "$DIR")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deno-integration-tests
          path: ${{ runner.temp }}/deno-integration-tests.tar.gz
          if-no-files-found: error
          retention-days: 1

  # This job (like e2e below) runs its own `yarn install`; it does not
  # consume any artifact from Compile, so it can start in parallel with it
  # instead of waiting ~40s for it to finish. The lint steps below don't
  # need built dist/ output, so the full type-check (`yarn tsc`) runs in
  # the Compile job only.
  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn oxlint .
      - run: yarn oxfmt --check .
      - run: yarn eslint .
      - run: yarn package lint --check
      - name: Validate package setup
        run: yarn setup-packages --check

  Unit:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows runs node 26 only: each windows cell cost ~80s (~50s of it
      # fixed setup: checkout, corepack shim overwrite, install) and history
      # shows no failures unique to windows node 22/24, so the other two
      # cells duplicated ubuntu's signal at ~160s of runner time per run.
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        include:
          - os: windows-latest
            node-version: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits deep so that, on pull_request runs, the PR merge ref
          # fetched below brings its first parent (the base branch head)
          # along: the affected-test selection diffs against it.
          fetch-depth: 2
      # The windows runner image's C:\npm\prefix yarn shims resolve to yarn
      # 1.x, so corepack must overwrite them in place. The old workaround
      # reinstalled corepack with npm (~10s per windows job); overwriting
      # the shims directly costs 3-4s. The image's corepack validates the
      # pinned yarn's signature fine (#2062 no longer reproduces), so
      # integrity checking stays on.
      - run: corepack enable --install-directory "C:\npm\prefix"
        if: runner.os == 'Windows'
      - run: corepack enable
        if: runner.os != 'Windows'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - run: yarn install --immutable
      # Affected-test selection, PR runs on the bare cells only. push runs
      # keep the full matrix, and the coverage cell below always runs the
      # whole suite so codecov still sees every file. The step only decides
      # whether a selection is safe; the vitest step below resolves which
      # suites import the changed files (vitest's module graph follows real
      # imports, including the cross-package ones some manifests don't
      # declare). Every uncertain case runs the full suite instead.
      - name: Select affected test suites
        if: github.event_name == 'pull_request' && !(matrix.os == 'ubuntu-latest' && matrix.node-version == 26)
        shell: bash
        run: |
          set -euo pipefail
          full() {
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # The selector must never fail a required check: any unexpected
          # error (git failure, broken pipe) selects the full suite.
          trap full ERR
          # Require a merge commit: on pull_request, HEAD is the PR merge
          # ref and its first parent is the base branch head, so the diff
          # below is exactly the PR's changes. push runs are excluded by
          # the step condition; this guards any other shape anyway.
          git rev-parse --verify -q HEAD^2 > /dev/null || full
          base=$(git rev-parse HEAD^1)
          files=$(git diff --no-renames --name-only "$base" HEAD)
          # Empty diff: full suite.
          [ -n "$files" ] || full
          # Deleted or renamed files change importers in ways the module
          # graph can't see from the surviving files alone.
          [ -z "$(git diff --no-renames --name-only --diff-filter=D "$base" HEAD)" ] || full
          # Only plain packages/ or tools/ paths select; the charset
          # rejects whitespace and shell metacharacters (the list feeds a
          # command line in the vitest step below). Anything else — root
          # configs, .github, the lockfile — runs the full suite.
          if printf '%s\n' "$files" | grep -qvE '^(packages|tools)/[A-Za-z0-9/._-]+$'; then
            full
          fi
          # A near-repo-wide diff gains nothing from selection and risks
          # windows' ~32k command-line limit.
          n=$(printf '%s\n' "$files" | wc -l)
          [ "$n" -le 300 ] || full
          printf '%s\n' "$files" > "$RUNNER_TEMP/affected-tests.txt"
          echo "mode=affected" >> "$GITHUB_OUTPUT"
          echo "selected $n changed file(s); running affected vitest suites only"
      # Coverage runs on one matrix cell only; every other cell runs the
      # suites bare. The per-OS coverage parity check measured identical
      # coverage on linux and windows (54 files, 1850/1934 vitest and
      # 193/217 jest statements on each OS), so a single ubuntu cell alone
      # sees everything. Bare vitest is 10-16s on windows instead of 28s.
      - run: yarn vitest --run --coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 26
      # On PR runs whose changes the step above deemed selectable, run only
      # the suites importing the changed files (vitest `related`); every
      # other case — push runs, the coverage cell, unselectable diffs —
      # runs the full suite. `related` resolves the real import graph, so
      # a core change still pulls in every prompt suite that imports it.
      - name: Run vitest suites
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node-version == 26) }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/affected-tests.txt" ]; then
            yarn vitest related --run --passWithNoTests $(cat "$RUNNER_TEMP/affected-tests.txt")
          else
            yarn vitest --run
          fi
      # Jest runs the two CJS adapter suites (~2s bare); they stay full in
      # all cells — a second selector for them wouldn't pay for itself.
      - run: yarn jest --coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 26
      - run: yarn jest
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node-version == 26) }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 26
        with:
          # Each tool writes its own subdirectory (vitest: coverage/vitest,
          # jest: coverage/jest) and emits istanbul JSON; coverage ownership
          # between them is disjoint (see vitest.config.ts and jest.config.js),
          # so codecov merges the uploads. Each tool cleans only its own
          # subdirectory at start, so run order doesn't matter.
          files: coverage/vitest/coverage-final.json,coverage/jest/coverage-final.json

  # The four e2e suites each run in their own isolated install (spawned by
  # `yarn isolate-monorepo-package`) and don't read each other's output, so
  # they run as four parallel jobs to overlap their fixed setup instead of
  # queuing behind each other. Each builds first: dist/ is packed into the
  # tarballs that the isolated suite below consumes. The full-repo
  # type-check (`yarn tsc` also runs `tsc -p tsconfig.json`) lives in the
  # Compile job only, so the validation is not duplicated here.
  e2e-demo-yarn:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn turbo tsc
      - name: Test isolated build of @inquirer/demo
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/demo)
          yarn set version stable
          yarn install
          yarn tsc
          cd -

  e2e-demo-npm:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn turbo tsc
      - name: Test isolated build of @inquirer/demo (with npm)
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/demo)
          npm install
          npm run tsc
          cd -

  e2e-esm-integration:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn turbo tsc
      - name: Run esm integration tests
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/esm-integration-tests)
          yarn set version stable
          yarn install
          yarn test
          cd -

  e2e-cjs-integration:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn turbo tsc
      - name: Run cjs integration tests
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/cjs-integration-tests)
          yarn set version stable
          yarn install
          yarn test
          cd -

  # Required check (main ruleset): keeps the 'End to End build tests' name
  # reporting while the suites themselves run in the four e2e jobs above.
  # It needs no runner work of its own: it joins the suite results.
  e2e:
    name: End to End build tests
    runs-on: ubuntu-latest
    needs: [e2e-demo-yarn, e2e-demo-npm, e2e-esm-integration, e2e-cjs-integration]
    steps:
      - name: All e2e suites passed
        run: echo "The e2e suites passed; this job reports their result as the required 'End to End build tests' check."

  deno:
    name: Deno Tests (${{ matrix.deno-version }})
    runs-on: ubuntu-latest
    needs: Compile
    strategy:
      fail-fast: false
      matrix:
        # Deno >= 2.7 is required: earlier versions throw EOPNOTSUPP when
        # node:readline enables raw mode on non-TTY stdin.
        deno-version: ['v2.7.x', 'v2.8.x', 'v2.9.x', 'latest']
    steps:
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}
      - run: corepack enable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deno-integration-tests
          path: ${{ runner.temp }}
      - name: Run deno integration tests
        run: |
          tar -xzf "${RUNNER_TEMP}/deno-integration-tests.tar.gz" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/deno"
          yarn test:deno
