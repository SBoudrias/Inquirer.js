name: CI

on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

permissions:
  contents: read

jobs:
  Compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Typescript
        run: yarn tsc

  Linting:
    runs-on: ubuntu-latest
    needs: Compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn oxlint .
      - run: yarn oxfmt --check .
      - run: yarn eslint .
      - run: yarn package lint --check
      - name: Validate package setup
        run: |
          yarn setup
          git diff --exit-code -- . :^.yarn

  Unit:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Windows runners ship a corepack too old for current package manager signatures (#2062).
      - run: npm install -g corepack --force # zizmor: ignore[adhoc-packages] required to fix broken corepack on windows runners
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn vitest --run --coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

  e2e:
    name: End to End build tests
    runs-on: ubuntu-latest
    needs: Compile
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn tsc
      - name: Test isolated build of @inquirer/demo
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/demo)
          yarn set version stable
          yarn install
          yarn tsc
          cd -
      - name: Test isolated build of @inquirer/demo (with npm)
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/demo)
          npm install
          npm run tsc
          cd -
      - name: Run esm integration tests
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/esm-integration-tests)
          yarn set version stable
          yarn install
          yarn test
          cd -
      - name: Run cjs integration tests
        run: |
          cd $(yarn isolate-monorepo-package @inquirer/cjs-integration-tests)
          yarn set version stable
          yarn install
          yarn test
          cd -

  deno-pack:
    name: Deno Pack
    runs-on: ubuntu-latest
    needs: Compile
    env:
      # The isolated deno workspace has no lockfile, so immutable installs
      # would fail inside it. The repo-level install still passes --immutable.
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn tsc
      - name: Pack isolated deno test project
        run: |
          DIR=$(yarn isolate-monorepo-package @inquirer/deno-integration-tests)
          cd "$DIR"
          yarn set version stable
          yarn install
          cd -
          tar -czf "${RUNNER_TEMP}/deno-integration-tests.tar.gz" \
            -C "$(dirname "$DIR")" "$(basename "$DIR")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deno-integration-tests
          path: ${{ runner.temp }}/deno-integration-tests.tar.gz
          if-no-files-found: error
          retention-days: 1

  deno:
    name: Deno Tests (${{ matrix.deno-version }})
    runs-on: ubuntu-latest
    needs: deno-pack
    strategy:
      fail-fast: false
      matrix:
        # Deno >= 2.7 is required: earlier versions throw EOPNOTSUPP when
        # node:readline enables raw mode on non-TTY stdin.
        deno-version: ['v2.7.x', 'v2.8.x', 'v2.9.x', 'latest']
    steps:
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deno-integration-tests
          path: ${{ runner.temp }}
      - name: Run deno integration tests
        run: |
          tar -xzf "${RUNNER_TEMP}/deno-integration-tests.tar.gz" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/deno"
          deno test --allow-env --allow-run=deno integration.test.mjs
