name: Corepack integrity probe

# Research probe (perf-caching): decompose PR #2352's corepack lever.
# v2: checks out the repo first, so `yarn --version` exercises the pinned
# yarn@4.18.1+sha512 from packageManager — the actual #2062 failure mode.
# Run on a probe branch only.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  windows-integrity-on:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: corepack enable (integrity on)
        run: corepack enable --install-directory "C:\npm\prefix"
      - name: pinned yarn --version (fetch + signature check)
        run: yarn --version

  windows-integrity-off:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: corepack enable (integrity off)
        run: corepack enable --install-directory "C:\npm\prefix"
        env:
          COREPACK_INTEGRITY_KEYS: '0'
      - name: pinned yarn --version (fetch, skips check)
        run: yarn --version
        env:
          COREPACK_INTEGRITY_KEYS: '0'
