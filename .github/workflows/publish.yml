name: Release

# Secure release pipeline (npm Trusted Publishing + Staged Publishing).
# See CONTRIBUTING.md "Publishing new versions" for the maintainer flow.
#
# Triggered by pushes to `main`. `yarn lerna version` bumps versions, commits,
# and creates tags (inquirer@<version>, @inquirer/<name>@<version>, ...) all
# pointing at the same commit; `lerna publish from-git --stage` then stages
# every package tagged at HEAD in a single run. A `guard` job skips the rest
# of the workflow when no release tag points at the pushed commit.
#
# Security model:
#   - No npm token exists to steal; auth is GitHub OIDC → npm Trusted Publishing.
#   - The publish job only *stages* the release. A maintainer must approve it
#     with 2FA (`npm stage approve`) before it goes live.
#   - Only the publish job has `id-token: write`; every job uses
#     `persist-credentials: false` on checkout. Installs are `--immutable`
#     with dependency scripts disabled (`enableScripts: false`) and a 3-day
#     minimum age gate on new package versions.
#   - lerna-lite applies `publishConfig` manifest overrides (main/types/exports)
#     natively during publish, and runs the root `prepublishOnly` build and
#     `prepack` lifecycle (workspace devDependency strip, README utm rewrite),
#     so the staged tarball matches what a local `lerna publish` would produce.
#   - The workflow filename must stay `publish.yml`: it is part of the Trusted
#     Publisher configuration on npmjs.com.

on:
  push:
    branches: ['main']
  workflow_dispatch: # manual trigger for maintainers (e.g. to re-run after a fix)

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-release: ${{ steps.check.outputs.has-release }}
    steps:
      - name: Check for release tags at HEAD
        id: check
        # Ask the remote instead of cloning: every release tag points at the
        # release commit, so a sha match is the whole question. A full fetch of
        # this repo's ~2400 tags costs 40-115s on the runner; one ls-remote
        # answers in ~2s. `cut -f1` keeps only the shas, so the exact match
        # cannot be fooled by a sha appearing inside a tag name.
        run: |
          TAGS=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" 'inquirer@*' '@inquirer/*@*' '@sboudrias/*@*')
          if echo "$TAGS" | cut -f1 | grep -qx "$GITHUB_SHA"; then
            echo "has-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    needs: [guard]
    if: needs.guard.outputs.has-release == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no cache poisoning risk in a release workflow
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run tests
        run: yarn vitest --run packages

  build:
    runs-on: ubuntu-latest
    needs: [guard]
    if: needs.guard.outputs.has-release == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no cache poisoning risk
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn tsc

  publish:
    runs-on: ubuntu-latest
    needs: [guard, test, build]
    if: needs.guard.outputs.has-release == 'true'
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # history is never walked below; only the tags matter
      # `lerna publish from-git` reads the release through `git tag --points-at
      # HEAD` (verified against lerna-lite 5.8.0's source: it never walks
      # history), so fetching all ~2400 tags costs 45-77s for nothing. Instead,
      # fetch only the ~21 tags that point at this commit (~1MB, ~2s). The
      # `refs/tags/<name>^{}` lines are the peeled shas of annotated tags, so
      # matching them against HEAD catches exactly the release tags.
      - name: Fetch the release tags at HEAD
        run: |
          SHA=$(git rev-parse HEAD)
          REFS=$(git ls-remote --tags origin 'inquirer@*' '@inquirer/*@*' '@sboudrias/*@*' | grep "^$SHA" | cut -f2)
          if [ -z "$REFS" ]; then
            echo "No release tag points at HEAD; nothing to publish." >&2
            exit 1
          fi
          SPECS=""
          for ref in $REFS; do
            tag=${ref#refs/tags/}
            tag=${tag%"^{}"}
            SPECS="$SPECS +refs/tags/$tag:refs/tags/$tag"
          done
          git fetch --no-tags --no-recurse-submodules --depth=1 origin $SPECS
          git tag --points-at HEAD --list '*@*'
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      # Build first (mirrors the Compile job in main.yml) so the turbo cache is
      # warm when lerna's root `prepublishOnly` re-runs `yarn tsc` during staging.
      # Without this, the publish job's fresh `@inquirer/testing:tsc` can fail to
      # resolve the optional-peer prompt packages that the Compile/build jobs
      # resolve via the turbo cache.
      - name: Build packages
        run: yarn tsc
      - name: Stage npm release
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 5
          retry_wait_seconds: 60
          command: yarn lerna publish from-git --stage --concurrency 1 --yes --no-git-reset
