on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
base:
  image: ubuntu:26.04
  config: rwx/base 1.2.0

defaults:
  runner:
    cpus: 4
    memory: 16gb

tool-cache:
  vault: default

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/SBoudrias/Inquirer.js.git
      ref: ${{ init.commit-sha }}

  - key: node
    call: nodejs/install 1.2.0
    with:
      node-version: 24.22.1

  - key: yarn-install
    use: [code, node]
    tool-cache: unit-tests-24.22.1-yarn-install
    run: |
      npm install --global corepack
      corepack enable
      yarn install --immutable
    filter:
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - packages/*/package.json
      - integration/*/package.json
      - tools/*/package.json

  - key: captain
    call: rwx/install-captain 1.2.0

  # E4: captain partitions the 34 test files across 4 parallel tasks;
  # RWX provides partition-index/total to captain automatically.
  - key: unit-tests
    use: [yarn-install, captain]
    parallel: 4
    run: captain run inquirer-vitest-partitioned
    timeout: 20m
