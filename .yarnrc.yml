approvedGitRepositories:
  - '**'

compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 4320

# Explicitly requested fresh releases are exempt from the age gate; it only
# guards against auto-bumps (dependabot / `yarn upgrade`) picking up a
# maliciously-published version. verkit ships in lockstep with lerna-lite.
npmPreapprovedPackages:
  - '@lerna-lite/*'
  - 'verkit'

# The yarn release is vendored in .yarn/releases so that a plain `yarn`
# (or corepack shim) delegates to it without any download; see CONTRIBUTING.md.
yarnPath: .yarn/releases/yarn-4.18.1.cjs
